name: CI — Java Build and Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: "-B --no-transfer-progress -Dstyle.color=never"

jobs:
  test:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Binaries are ordinary blobs; do not fetch Git LFS.
          lfs: false

      # The dashboard imports the read-only QA matcher and its NumPy
      # dependency. Use the same supported Python runtime across CI jobs.
      - name: Set up Python for offline QA tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline QA test dependency
        run: python3 -m pip install --disable-pip-version-check "numpy>=2.0,<3"

      - name: Audit all recognition template resources
        run: python3 tools/audit-template-assets.py --baseline tools/template-missing-baseline.json

      - name: Test complete template inventory and evidence parser
        run: python3 -m unittest discover -s tools/template-system-audit -p 'test_*.py' -v

      - name: Test shared QA dashboard and two-party acceptance protocol
        env:
          SURVIVALOPS_REPO: ${{ github.workspace }}
          SURVIVALOPS_TEMPLATE_AUDIT_REPORT: ${{ runner.temp }}/survivalops-template-audit/report.json
        run: |
          # Generate the same bounded, read-only catalog that the dashboard
          # uses in production. No private evidence or emulator is required.
          python3 tools/template-system-audit/audit.py --output "$RUNNER_TEMP/survivalops-template-audit" > /dev/null
          python3 -m unittest discover -s tools/task-dashboard -p 'test_*.py' -v

      - name: Test QA browser draft preservation and syntax
        run: |
          node --check tools/task-dashboard/static/app.js
          node tools/task-dashboard/test_ui_drafts.cjs

      - name: Verify shipped binaries are real files
        run: build-support/verification/check_lfs_assets.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test build and release tooling
        run: |
          python3 build-support/release/verify_development_version.py
          python3 -m unittest discover -s build-support/verification -p "test_*.py"
          python3 -m unittest discover -s build-support/release -p "test_*.py"
          python3 -m unittest discover -s build-support/notifications -p "test_*.py"
          python3 build-support/verification/check_workflow_python.py

      # Saved-frame OCR tests bind the host Tesseract libraries through tess4j.
      # JavaFX controller tests need a virtual display on the headless runner.
      - name: Install Linux test runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libtesseract-dev libleptonica-dev xvfb

      - name: Build and test Maven reactor
        run: |
          read -r -a maven_args <<< "${MAVEN_ARGS}"
          xvfb-run --auto-servernum ./mvnw "${maven_args[@]}" package

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-surefire-reports
          path: "**/target/surefire-reports/*.xml"
          if-no-files-found: ignore
          retention-days: 7
