name: SurvivalOps — Windows Installer

on:
  pull_request:
    paths:
      - "modules/**/src/**"
      - "packaging/desktop/**"
      - "build-support/packaging/**"
      - "build-support/verification/*app_image*"
      - ".github/workflows/survivalops-windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: survivalops-windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build standalone SurvivalOps Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Verify shipped binaries
        shell: bash
        run: build-support/verification/check_lfs_assets.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          cache: maven
      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $wixBin "candle.exe"))) { throw "WiX candle.exe missing" }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build SurvivalOps application image
        shell: pwsh
        run: |
          $args = @(
            "-B", "--no-transfer-progress", "-Dstyle.color=never",
            "-Drevision=1.0.0", "-Dfrostguard.windows.app-version=1.0.0",
            "-Dfrostguard.windows.launcher-version=1.0.0",
            "-Dfrostguard.product.name=SurvivalOps",
            "-Dfrostguard.product.identifier=dev.survivalops.desktop",
            "-Dfrostguard.product.description=SurvivalOps Whiteout Survival Automation Suite",
            "-Dfrostguard.product.install-dir=SurvivalOps",
            "-Dfrostguard.watcher.name=SurvivalOpsWatcher",
            "-Dfrostguard.product.upgrade-uuid=6d5b2a7e-9b3a-4f2a-8c1d-0e7f6a5b4c31",
            "-Dfrostguard.pull-request-build=true", "-Pwindows-app-image", "package"
          )
          & .\mvnw.cmd @args
          if ($LASTEXITCODE -ne 0) { throw "SurvivalOps app-image build failed" }
      - name: Verify SurvivalOps application image
        shell: pwsh
        run: |
          $image = "packaging/desktop/target/app-image/SurvivalOps"
          if (-not (Test-Path "$image/SurvivalOps.exe")) { throw "SurvivalOps.exe missing" }
          if (-not (Test-Path "$image/runtime/bin/java.exe")) { throw "Bundled Java runtime missing" }
          if (-not (Test-Path "$image/SurvivalOpsWatcher.exe")) { throw "Watcher launcher missing" }
      - name: Build SurvivalOps MSI installer
        shell: pwsh
        run: |
          $args = @(
            "-B", "--no-transfer-progress", "-Dstyle.color=never",
            "-Drevision=1.0.0", "-Dfrostguard.windows.app-version=1.0.0",
            "-Dfrostguard.windows.launcher-version=1.0.0",
            "-Dfrostguard.product.name=SurvivalOps",
            "-Dfrostguard.product.identifier=dev.survivalops.desktop",
            "-Dfrostguard.product.description=SurvivalOps Whiteout Survival Automation Suite",
            "-Dfrostguard.product.install-dir=SurvivalOps",
            "-Dfrostguard.watcher.name=SurvivalOpsWatcher",
            "-Dfrostguard.product.upgrade-uuid=6d5b2a7e-9b3a-4f2a-8c1d-0e7f6a5b4c31",
            "-Dfrostguard.pull-request-build=true", "-Pwindows-installer", "package"
          )
          & .\mvnw.cmd @args
          if ($LASTEXITCODE -ne 0) { throw "SurvivalOps MSI build failed" }
      - name: Verify and upload MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem "packaging/desktop/target/installers/stable" -Filter "SurvivalOps-*.msi" -File
          if ($msi.Count -ne 1 -or $msi[0].Length -lt 1MB) { throw "Expected one valid SurvivalOps MSI" }
          Get-FileHash $msi[0].FullName -Algorithm SHA256 | Format-List
      - name: Upload SurvivalOps installer
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalOps-Windows-Installer
          path: packaging/desktop/target/installers/stable/SurvivalOps-*.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
