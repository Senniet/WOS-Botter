name: SurvivalOps - Unblock stale release run

on:
  push:
    branches:
      - feature/survivalops-ui
    paths:
      - .github/workflows/survivalops-unblock-stale-run.yml

permissions:
  contents: read
  actions: write

jobs:
  unblock:
    name: Force-cancel stale SurvivalOps release only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Force cancel stuck 1.1.25 run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Inspecting release run 43094870410...'
          gh api "repos/$GH_REPO/actions/runs/43094870410" --jq '{status, conclusion, head_branch}'
          if gh api -X POST "repos/$GH_REPO/actions/runs/43094870410/force-cancel"; then
            echo 'Force-cancel request accepted.'
          else
            echo 'GitHub rejected force-cancel; inspect workflow log for the response.' >&2
            exit 1
          fi
